name: CI

# The pull request pipeline is budgeted to finish in well under 30 minutes: jobs that build their own package start without
# waiting for `build`, every job has a tight timeout, and browser installs are cached and bounded. The slow, rarely failing
# Firefox/WebKit matrix runs weekly in ci-extended.yml (also on demand, and on pull requests labelled `full-ci`).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  static:
    name: Static checks (format, types, Agentyx lock, specs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck:scripts
      - run: pnpm agentyx:check
      - name: Agentyx frozen install reproduces the committed files
        run: |
          pnpm exec agentyx install --frozen
          git diff --exit-code
      - run: pnpm sdd:check
      - run: pnpm api:check
      - run: pnpm content:check

  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The official site's tests import the built @doqs/analog package, exactly like a consumer.
      - run: pnpm build:doq
      - run: pnpm test:unit
      - run: pnpm test:components

  tooling-windows:
    name: Node tooling on Windows (CRLF checkout, junctions, paths)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # This repository pins LF in .gitattributes; verify:portable converts its copy to CRLF itself, which is what a consumer
      # repository without that attribute gets on Windows.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:portable
      - run: pnpm api:check
      - run: pnpm content:check
      - run: pnpm exec vitest run -c vitest.unit.config.ts packages/doq/test/unit/cli.spec.ts packages/doq/test/unit/content.spec.ts packages/doq/test/unit/api-reference.spec.ts packages/doq/test/unit/portability.spec.ts

  build:
    name: Production builds and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Optional repository variable: the public origin enables canonical URLs and the sitemap of apps/site.
          DOQ_SITE_ORIGIN: ${{ vars.DOQ_SITE_ORIGIN }}
      - run: pnpm pack:doq
      - run: pnpm verify:package "artifacts/doqs-analog-$(node -p "require('./packages/doq/package.json').version").tgz"
      # The packed declarations against the committed public API report and the last compatible release's baseline.
      - run: pnpm verify:public-api
      # Static integrity of the prerendered output (heading ids vs a sequential render, TOC fragments, links, routes, canonicals)
      # and the measured size budgets (perf-budgets.json).
      - run: pnpm docs:check
      - run: pnpm perf:check
      - uses: actions/upload-artifact@v7
        with:
          name: builds
          retention-days: 3
          if-no-files-found: error
          path: |
            artifacts/*.tgz
            apps/site/dist/analog/public
            apps/showcase-a/dist/analog/public
            apps/showcase-b/dist/analog/public
            apps/showcase-b/dist/analog-nosearch/public
      # Consumed by release.yml (exactly this verified tarball is what gets published) and deploy-site.yml (this exact site).
      - uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          retention-days: 14
          if-no-files-found: error
          path: artifacts/*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          retention-days: 14
          if-no-files-found: error
          path: apps/site/dist/analog/public

  contract:
    name: Python contract tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: builds
      - run: pnpm test:contract

  e2e:
    name: Playwright E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: builds
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          retention-days: 7
          path: |
            test-results
            playwright-report

  acceptance:
    name: MVP and 0.1 acceptance harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:doq
      - run: pnpm consumer:build
        env:
          DOQ_CONSUMER_DIR: ${{ runner.temp }}/doq-consumer
      # Bare Analog applications (Angular 21 embedded and docs-first, Angular 22) adopt the tarball through doq doctor / doq init.
      - run: pnpm verify:init
      - name: Full CDP harness including the tarball-installed consumer
        run: pnpm verify:mvp
        env:
          MVP_CONSUMER_ROOT: ${{ runner.temp }}/doq-consumer/dist/analog/public

  determinism:
    name: Deterministic builds (repeated clean builds, guard control)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:doq
      - run: pnpm pack:doq
      - name: Five clean builds of the stress consumer agree on every heading id
        run: pnpm verify:determinism --builds=5 --docs=60
      - name: The same stress without doqDeterministicMarkdown() is detected as inconsistent
        run: pnpm verify:determinism --builds=3 --docs=60 --control

  compat:
    name: Angular ${{ matrix.angular }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 21: the primary environment of the repository (also covered by the full suite). 22: Angular 22 with TypeScript 6.
        angular: ['21', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:doq
      - run: pnpm pack:doq
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium
      - run: pnpm verify:compat --angular=${{ matrix.angular }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-compat-${{ matrix.angular }}
          retention-days: 7
          path: |
            test-results
            playwright-report

  scale:
    name: Content scaling budget (generated fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:doq
      - run: pnpm pack:doq
      - name: 20 and 200 generated documents (plus archives) build, and one more document costs a bounded amount of JavaScript
        run: pnpm perf:scale --sizes=20,200 --navigations=0 --check
