name: Playwright browsers
description: >-
  Installs Playwright browsers inside node_modules (PLAYWRIGHT_BROWSERS_PATH=0), restoring the downloads from the Actions cache
  without running apt on GitHub-hosted Ubuntu runners.
inputs:
  browsers:
    description: Space-separated Playwright browser names, e.g. "chromium" or "firefox webkit".
    required: true
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      # @playwright/test pins playwright-core to the same version; with PLAYWRIGHT_BROWSERS_PATH=0 the browsers land in its
      # package directory inside the pnpm store.
      run: |
        version=$(node -p "require('@playwright/test/package.json').version")
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "path=node_modules/.pnpm/playwright-core@$version/node_modules/playwright-core/.local-browsers" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      with:
        path: ${{ steps.version.outputs.path }}
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ inputs.browsers }}
    # GitHub-hosted Ubuntu runners already include Playwright's required system libraries. Avoid --with-deps: apt may be locked
    # during runner startup, and its optional font/Xvfb packages can stall cold CI runs.
    - shell: bash
      env:
        PLAYWRIGHT_BROWSERS_PATH: '0'
        BROWSERS: ${{ inputs.browsers }}
      run: |
        pnpm exec playwright install $BROWSERS
