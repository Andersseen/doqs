name: Playwright browsers
description: >-
  Installs Playwright browsers inside node_modules (PLAYWRIGHT_BROWSERS_PATH=0), restoring the downloads from the Actions cache
  and bounding every attempt in time, so a stalled download or apt mirror fails over in minutes instead of hanging the job.
inputs:
  browsers:
    description: Space-separated Playwright browser names, e.g. "chromium" or "firefox webkit".
    required: true
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      # @playwright/test pins playwright-core to the same version; with PLAYWRIGHT_BROWSERS_PATH=0 the browsers land in its
      # package directory inside the pnpm store.
      run: |
        version=$(node -p "require('@playwright/test/package.json').version")
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "path=node_modules/.pnpm/playwright-core@$version/node_modules/playwright-core/.local-browsers" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      with:
        path: ${{ steps.version.outputs.path }}
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ inputs.browsers }}
    # The runner image rebuilds the man-db index after every apt install, which alone can take minutes.
    - if: runner.os == 'Linux'
      shell: bash
      run: sudo rm -f /var/lib/man-db/auto-update
    - shell: bash
      env:
        PLAYWRIGHT_BROWSERS_PATH: '0'
        BROWSERS: ${{ inputs.browsers }}
      run: |
        for attempt in 1 2 3; do
          if timeout 420 pnpm exec playwright install --with-deps $BROWSERS; then exit 0; fi
          echo "::warning::playwright install ($BROWSERS) attempt $attempt failed or timed out after 7 minutes"
          sleep 15
        done
        exit 1
